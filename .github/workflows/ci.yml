name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Tests + cobertura
        run: pytest -q --cov --cov-report=term-missing --cov-fail-under=80
      - name: Tests de integración
        run: pytest -q -m integration
      - name: Flujo completo sobre la muestra (sin claves ni red hacia HF)
        run: |
          make all
          test -s reports/predictions.csv
          test -s reports/run_metrics.json
          grep -q '"ai_provider": "mock"' reports/run_metrics.json
      - name: El envoltorio de cron propaga el código de salida
        run: bash scripts/run_pipeline.sh --top-n 5 && tail -n 3 logs/pipeline.log
